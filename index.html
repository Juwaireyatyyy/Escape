<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مخنوقه وانا موجود؟ احنا هنخيب ولا ايه 😂</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #1f2544, #111629);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    .game-wrapper {
      width: min(440px, 100vw);
      height: min(760px, 100vh);
      background: #171c33;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at top, #343b6d, #171c33 55%, #111629);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      background: rgba(10, 13, 28, 0.82);
      backdrop-filter: blur(8px);
      z-index: 5;
    }

    .hidden {
      display: none;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.7;
      color: #d8defc;
      max-width: 330px;
      margin-bottom: 22px;
    }

    .rules {
      width: 100%;
      max-width: 330px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 22px;
      text-align: right;
      line-height: 1.9;
      color: #edf0ff;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 14px 22px;
      background: #ffcf6d;
      color: #1a1720;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 0 #b98528;
      transition: transform 0.1s, box-shadow 0.1s;
      font-family: Tahoma, Arial, sans-serif;
    }

    button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b98528;
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      z-index: 2;
      pointer-events: none;
    }

    .hud-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 13px;
      color: #fff;
      text-align: right;
    }

    .bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: #80f0a0;
    }

    .controls {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 22px;
      z-index: 3;
      pointer-events: none;
      direction: ltr;
    }

    .control-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      pointer-events: auto;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 100px;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 4;
      white-space: nowrap;
      text-align: center;
    }

    .message.show {
      opacity: 1;
    }

    @media (min-width: 700px) {
      .controls {
        display: none;
      }
    }

    @media (max-height: 640px) {
      h1 {
        font-size: 28px;
      }

      .subtitle,
      .rules {
        font-size: 13px;
      }

      .control-btn {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>

<body>
  <div class="game-wrapper">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="hud-card">
        النقاط: <span id="score">0</span>
        <br />
        أعلى نتيجة: <span id="best">0</span>
      </div>

      <div class="hud-card">
        الهدوء
        <div class="bar">
          <div class="bar-fill" id="healthBar"></div>
        </div>
      </div>
    </div>

    <div class="message" id="message">يلا نبدأ</div>

    <div class="controls">
      <div class="control-btn" id="leftBtn">‹</div>
      <div class="control-btn" id="rightBtn">›</div>
    </div>

    <div class="screen" id="startScreen">
      <h1>  ♥️ اهلا اهلا جويريتي ♥️</h1>

      <p class="subtitle">
        فكرة اللعبه تحت اهي 🙃
      </p>

      <div class="rules">
        👹 اهربي من: الخنقة، الهرمونات، التفكير الزيادة، الدوشة
        <br />
        🌹 اجمعي: ورد، شوكولاتة، فلوث، شاي بلبن، أنا
        <br />
        🌚 أنا بديكي درع حماية
        <br />
        🏆 وصلي 60 نقطة عشان تكسبي
      </div>

      <button id="startBtn">ابدئي اللعبة</button>
    </div>

    <div class="screen hidden" id="endScreen">
      <h1 id="endTitle">خلصت اللعبة</h1>
      <p class="subtitle" id="endText">عديتي الجولة دي.</p>
      <button id="restartBtn">العبي تاني</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const healthBar = document.getElementById("healthBar");
    const startScreen = document.getElementById("startScreen");
    const endScreen = document.getElementById("endScreen");
    const endTitle = document.getElementById("endTitle");
    const endText = document.getElementById("endText");
    const message = document.getElementById("message");

    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");

    let width = 0;
    let height = 0;
    let gameRunning = false;
    let score = 0;
    let health = 100;
    let best = Number(localStorage.getItem("escapeStressBestArabic") || 0);
    let lastSpawn = 0;
    let spawnDelay = 700;
    let lastTime = 0;
    let shieldTime = 0;
    let keys = { left: false, right: false };
    let items = [];
    let particles = [];

    const player = {
      x: 0,
      y: 0,
      w: 46,
      h: 54,
      speed: 340
    };

    const goodItems = [
      { label: "ورد", icon: "🌹", points: 3 },
      { label: "شوكولاتة", icon: "🍫", points: 4 },
      { label: "فلوث", icon: "💸", points: 5 },
      { label: "شاي بلبن", icon: "🧋", points: 5 },
      { label: "أنا", icon: "🌚💪", points: 7, shield: true }
    ];

    const badItems = [
      { label: "خنقة", icon: "👹", damage: 18 },
      { label: "هرمونات", icon: "👺", damage: 22 },
      { label: "تفكير زيادة", icon: "🧠", damage: 20 },
      { label: "دوشة", icon: "😵‍💫", damage: 16 }
    ];

    bestEl.textContent = best;

    function resize() {
      const box = canvas.parentElement.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = box.width;
      height = box.height;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      player.y = height - 118;
      player.x = Math.min(Math.max(player.x || width / 2, player.w), width - player.w);
    }

    window.addEventListener("resize", resize);
    resize();

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("show");

      clearTimeout(showMessage.timer);

      showMessage.timer = setTimeout(() => {
        message.classList.remove("show");
      }, 1200);
    }

    function resetGame() {
      score = 0;
      health = 100;
      items = [];
      particles = [];
      shieldTime = 0;
      lastSpawn = 0;
      spawnDelay = 700;

      player.x = width / 2;
      player.y = height - 118;

      scoreEl.textContent = score;
      healthBar.style.width = "100%";
      healthBar.style.background = "#80f0a0";

      gameRunning = true;
      lastTime = performance.now();
    }

    function startGame() {
      startScreen.classList.add("hidden");
      endScreen.classList.add("hidden");

      resetGame();
      requestAnimationFrame(loop);
    }

    function endGame(won) {
      gameRunning = false;

      best = Math.max(best, score);
      localStorage.setItem("escapeStressBestArabic", best);
      bestEl.textContent = best;

      endTitle.textContent = won ? "كسبتي وهربتي" : "الخنقة كسبت الجولة";
      endText.textContent = won ? "تمام، أنا أنقذت اليوم 🌚💪" : "مش وحش. جربي جولة كمان.";

      endScreen.classList.remove("hidden");
    }

    function randomItem() {
      const isGood = Math.random() < 0.44;

      const data = isGood
        ? goodItems[Math.floor(Math.random() * goodItems.length)]
        : badItems[Math.floor(Math.random() * badItems.length)];

      return {
        ...data,
        good: isGood,
        x: 28 + Math.random() * (width - 56),
        y: -40,
        size: data.label === "أنا" ? 40 : 34,
        speed: 130 + Math.random() * 125 + score * 1.8,
        rotate: Math.random() * Math.PI * 2
      };
    }

    function spawnItem(time) {
      if (time - lastSpawn > spawnDelay) {
        items.push(randomItem());
        lastSpawn = time;
        spawnDelay = Math.max(260, 700 - score * 6);
      }
    }

    function updatePlayer(dt) {
      let move = 0;

      if (keys.left) move -= 1;
      if (keys.right) move += 1;

      player.x += move * player.speed * dt;

      player.x = Math.max(
        player.w / 2 + 8,
        Math.min(width - player.w / 2 - 8, player.x)
      );
    }

    function updateItems(dt) {
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];

        item.y += item.speed * dt;
        item.rotate += dt * 2;

        if (collides(item)) {
          collectItem(item);
          items.splice(i, 1);
          continue;
        }

        if (item.y > height + 60) {
          items.splice(i, 1);
        }
      }
    }

    function collectItem(item) {
      if (item.good) {
        score += item.points;
        health = Math.min(100, health + 2);

        createParticles(item.x, item.y, item.icon);

        if (item.shield) {
          shieldTime = 4;
          showMessage("أنا جيت أهو 🌚");
        }

        if (item.label === "ورد") showMessage("ورد وصل 🌹");
        if (item.label === "شوكولاتة") showMessage("شوكولاتة للمود 🍫");
        if (item.label === "فلوث") showMessage("فلوث كتير 💸");
        if (item.label === "شاي بلبن") showMessage("شاي بلبن يعدل المود 🧋");
      } else {
        if (shieldTime > 0) {
          showMessage("أنا حميتك 🌚💪");
          createParticles(item.x, item.y, "✨");
        } else {
          health -= item.damage;
          showBadMessage(item.label);
          shakeScreen();
        }
      }

      scoreEl.textContent = score;
      updateHealthBar();

      if (score >= 60) endGame(true);
      if (health <= 0) endGame(false);
    }

    function showBadMessage(label) {
      if (label === "خنقة") showMessage("الخنقة قربت 👹");
      if (label === "هرمونات") showMessage("هرمونات هجمت 👺");
      if (label === "تفكير زيادة") showMessage("تفكير زيادة 🧠");
      if (label === "دوشة") showMessage("دوشة كتير 😵‍💫");
    }

    function collides(item) {
      const dx = Math.abs(item.x - player.x);
      const dy = Math.abs(item.y - player.y);

      return dx < (item.size + player.w) / 2 && dy < (item.size + player.h) / 2;
    }

    function updateHealthBar() {
      healthBar.style.width = Math.max(0, health) + "%";

      if (health > 55) {
        healthBar.style.background = "#80f0a0";
      } else if (health > 25) {
        healthBar.style.background = "#ffcf6d";
      } else {
        healthBar.style.background = "#ff6d7a";
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.y += p.vy * dt;
        p.x += p.vx * dt;
        p.life -= dt;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function createParticles(x, y, icon) {
      for (let i = 0; i < 6; i++) {
        particles.push({
          x,
          y,
          icon,
          vx: -60 + Math.random() * 120,
          vy: -120 - Math.random() * 80,
          life: 0.55 + Math.random() * 0.35
        });
      }
    }

    function shakeScreen() {
      const wrapper = canvas.parentElement;

      wrapper.animate(
        [
          { transform: "translateX(0)" },
          { transform: "translateX(-6px)" },
          { transform: "translateX(6px)" },
          { transform: "translateX(0)" }
        ],
        { duration: 180 }
      );
    }

    function drawBackground() {
      ctx.clearRect(0, 0, width, height);

      ctx.fillStyle = "rgba(255,255,255,0.08)";

      for (let i = 0; i < 24; i++) {
        const x = (i * 53 + performance.now() * 0.015) % width;
        const y = (i * 97) % height;

        ctx.beginPath();
        ctx.arc(x, y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "rgba(255,255,255,0.06)";
      ctx.fillRect(0, height - 72, width, 72);
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);

      if (shieldTime > 0) {
        ctx.strokeStyle = "rgba(255, 207, 109, 0.8)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, 43, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = "#ffcf6d";
      ctx.beginPath();
      ctx.roundRect(-23, -27, 46, 54, 16);
      ctx.fill();

      ctx.fillStyle = "#1a1720";
      ctx.beginPath();
      ctx.arc(-8, -7, 3, 0, Math.PI * 2);
      ctx.arc(8, -7, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#1a1720";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 4, 9, 0.1, Math.PI - 0.1);
      ctx.stroke();

      ctx.fillStyle = "#f3b64a";
      ctx.fillRect(-13, 25, 10, 10);
      ctx.fillRect(3, 25, 10, 10);

      ctx.restore();
    }

    function drawItems() {
      items.forEach(item => {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(Math.sin(item.rotate) * 0.12);

        ctx.font = `${item.size}px Tahoma`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.icon, 0, 0);

        ctx.font = "11px Tahoma";
        ctx.fillStyle = item.good ? "#dfffe8" : "#ffd8dd";
        ctx.fillText(item.label, 0, item.size / 2 + 14);

        ctx.restore();
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.font = "18px Tahoma";
        ctx.textAlign = "center";
        ctx.fillText(p.icon, p.x, p.y);
        ctx.restore();
      });
    }

    function drawGoalText() {
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.font = "13px Tahoma";
      ctx.textAlign = "center";

      ctx.fillText("الهدف: 60 نقطة", width / 2, 82);

      if (shieldTime > 0) {
        ctx.fillStyle = "rgba(255, 207, 109, 0.95)";
        ctx.fillText(`درع أنا: ${shieldTime.toFixed(1)} ثانية`, width / 2, 104);
      }
    }

    function loop(time) {
      if (!gameRunning) return;

      const dt = Math.min((time - lastTime) / 1000, 0.033);
      lastTime = time;

      if (shieldTime > 0) {
        shieldTime = Math.max(0, shieldTime - dt);
      }

      spawnItem(time);
      updatePlayer(dt);
      updateItems(dt);
      updateParticles(dt);

      drawBackground();
      drawGoalText();
      drawItems();
      drawParticles();
      drawPlayer();

      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        keys.left = true;
      }

      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        keys.right = true;
      }
    });

    document.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        keys.left = false;
      }

      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        keys.right = false;
      }
    });

    function holdButton(button, direction) {
      const start = e => {
        e.preventDefault();
        keys[direction] = true;
      };

      const end = e => {
        e.preventDefault();
        keys[direction] = false;
      };

      button.addEventListener("touchstart", start, { passive: false });
      button.addEventListener("touchend", end, { passive: false });
      button.addEventListener("touchcancel", end, { passive: false });

      button.addEventListener("mousedown", start);
      button.addEventListener("mouseup", end);
      button.addEventListener("mouseleave", end);
    }

    holdButton(leftBtn, "left");
    holdButton(rightBtn, "right");

    canvas.addEventListener(
      "touchmove",
      e => {
        if (!gameRunning) return;

        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();

        player.x = touch.clientX - rect.left;

        player.x = Math.max(
          player.w / 2 + 8,
          Math.min(width - player.w / 2 - 8, player.x)
        );

        e.preventDefault();
      },
      { passive: false }
    );

    canvas.addEventListener("mousemove", e => {
      if (!gameRunning || e.buttons !== 1) return;

      const rect = canvas.getBoundingClientRect();
      player.x = e.clientX - rect.left;
    });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        this.beginPath();
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
      };
    }
  </script>
</body>
</html>
